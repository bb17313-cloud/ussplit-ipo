name: Stock Bot (IPO + Reverse Splits)

on:
  schedule:
    # تشغيل كل 10 دقائق خلال ساعات السوق الأمريكي والتداول الممتد
    - cron: '*/10 8-23 * * 1-5'   # الإثنين–الجمعة من 8:00 إلى 23:50 UTC
    - cron: '*/10 0 * * 2-6'      # منتصف الليل UTC أيام الثلاثاء–السبت

  workflow_dispatch:  # تشغيل يدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # استخدام action المدمجة للـ Restore والـ Save في آن واحد
      - name: Cache & Restore watchlist files
        uses: actions/cache@v4
        with:
          path: |
            splits_watchlist.json
            ipo_watchlist.json
            presplit_floats.json
          key: stock-bot-data-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            stock-bot-data-${{ github.ref_name }}-
            stock-bot-data-

      - name: Run Stock Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python main.py
